name: Release

# Build the KitQA binaries on GitHub and attach them to a Release.
# The version is taken from the git tag (e.g. pushing tag "v1.2.4" injects
# v1.2.4 into internal/version.Version via -ldflags) — no source edit needed.
#
# Trigger a release:   git tag v1.2.4 && git push origin v1.2.4
# Manual test build:   Actions → Release → Run workflow (enter a version); the
#                      binaries are uploaded as workflow artifacts, not a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp into the binaries (e.g. v1.2.4-rc1)'
        required: true
        default: 'v0.0.0-dev'

permissions:
  contents: write   # needed to create the Release and upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            asset: KitQA_windows_x64.exe
          - goos: darwin
            goarch: arm64
            asset: KitQA_mac_arm64
          - goos: darwin
            goarch: amd64
            asset: KitQA_mac_x64
          - goos: linux
            goarch: amd64
            asset: KitQA_linux_x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ matrix.asset }}
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          go build \
            -ldflags "-s -w -X github.com/wirsal/kitqa/internal/version.Version=${VERSION}" \
            -o "dist/${{ matrix.asset }}" ./cmd/main.go

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
          fail_on_unmatched_files: true
